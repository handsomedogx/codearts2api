[project]
name = "codearts2api"
version = "0.8.0"
description = "OpenAI-compatible API gateway for Huawei CodeArts Agent using legitimate Huawei Cloud credentials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "cryptography>=46.0.0",
  "python-dotenv>=1.1.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
